<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박람회 분석·보고서 — 2026.08.15 부산</title>
<style>
:root{
  --ink:#12161c;--ink-2:#39424f;--paper:#eeeae2;--card:#ffffff;--rule:#c9c2b6;
  --seal:#8c2f26;--amber:#a86a12;--ok:#2c5c46;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:90px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.masthead{padding:18px 0 12px;border-bottom:2px solid var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
h1{margin:6px 0 4px;font-size:24px;line-height:1.15;letter-spacing:-.03em;font-weight:800}
.sub{font-size:12.5px;color:var(--ink-2)}
h2{font-size:13px;letter-spacing:.02em;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--ink);font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--rule);padding:12px}
.kpi b{display:block;font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;margin-bottom:6px}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .u{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi.seal .v{color:var(--seal)}.kpi.ok .v{color:var(--ok)}.kpi.amber .v{color:var(--amber)}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}

.panel{background:var(--card);border:1px solid var(--rule);padding:14px;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar .lab{flex:0 0 130px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{flex:1;height:18px;background:#f3f0ea;border:1px solid var(--rule);position:relative}
.bar .fill{height:100%;background:var(--ink)}
.bar.ok .fill{background:var(--ok)}.bar.seal .fill{background:var(--seal)}.bar.amber .fill{background:var(--amber)}
.bar .val{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
.bar .val small{font-weight:600;color:var(--ink-2)}

table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;background:var(--card)}
th,td{border:1px solid var(--rule);padding:6px 8px;text-align:right;white-space:nowrap}
th{background:#f7f4ee;font-weight:800;color:var(--ink-2)}
td.nm,th.nm{text-align:left;white-space:normal}
tr.best td{background:#f1f7f3}
.tblwrap{overflow-x:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2)}
.tag.seal{border-color:var(--seal);color:var(--seal)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.amber{border-color:var(--amber);color:var(--amber)}

.note{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:8px}
.empty{padding:26px 14px;text-align:center;color:var(--ink-2);font-size:14px;border:1px dashed var(--rule);background:var(--card)}
.err{border-color:var(--seal);color:var(--seal);background:#fbf1f0}

.bar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center}
.bar-fixed .st{flex:1;color:#fff;font-size:11.5px;opacity:.75}
button{font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 15px;border-radius:2px;cursor:pointer;border:1px solid #fff;background:transparent;color:#fff}
button.solid{background:#fff;color:var(--ink)}
button:active{transform:translateY(1px)}
a.back{font-size:12px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)}

footer{font-size:11px;color:var(--ink-2);padding:20px 0 6px;line-height:1.6;border-top:1px solid var(--rule);margin-top:24px}

/* 인쇄용 A4 보고서 */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .bar-fixed,#refresh,#printBtn,a.back{display:none !important}
  .wrap{max-width:none;padding:0}
  .panel,.kpi{border:1px solid #999;break-inside:avoid}
  .bar .track{border:1px solid #999}
  .bar .fill{background:#333 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h2{border-color:#000}
  .printonly{display:block !important}
}
.printonly{display:none}
</style>
</head>
<body>

<div class="wrap">
<header class="masthead">
  <div class="eyebrow">현장점검 분석·보고서 · M1 시장조사</div>
  <h1>부산 웨딩박람회<br>업체 점검 분석 보고서</h1>
  <div class="sub" id="subline">2026.08.15 · 축적 데이터 집계 · 계약 아님 / 자료 수집</div>
  <div class="printonly" style="margin-top:8px;font-size:12px" id="printMeta"></div>
  <div style="margin-top:8px"><a class="back" id="backLink" href="박람회_현장점검_양식.html">← 입력 폼으로</a></div>
</header>

<div id="content"></div>

<footer>
  집계 원본: 연결된 구글 시트(박람회_업체 탭). 이 보고서는 시트 축적 데이터를 실시간 요약한 것.<br>
  ※ 법률 자문 아님. 계약 판단은 본인 또는 변호사 몫. 최소지출은 대관료+(1인식대×보증인원) 기준이며 부가세·꽃·주류 별도.
</footer>
</div>

<div class="bar-fixed">
  <div class="st" id="status">불러오는 중…</div>
  <button id="refresh">새로고침</button>
  <button class="solid" id="printBtn">보고서 인쇄 · PDF</button>
</div>

<script>
const $=s=>document.querySelector(s);
function status(m){$('#status').textContent=m}
const GAS=(typeof google!=='undefined'&&google.script&&google.script.run);
function getEp(){ try{const r=localStorage.getItem('fair-2026-08-15'); if(r){const d=JSON.parse(r); return (d&&d.ep)||''}}catch(e){} return ''; }
function call(action){
  if(GAS){
    return new Promise((res,rej)=>{
      const run=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message)||'서버 오류')));
      if(action==='stats') run.apiStats();
      else if(action==='rows') run.apiRows();
      else rej(new Error('unknown action'));
    });
  }
  const ep=getEp();
  if(!ep) return Promise.reject(new Error('연동 URL 없음 — 입력 폼에서 연동 설정을 먼저 완료한 뒤 다시 여세요'));
  return fetch(ep,{method:'POST',body:JSON.stringify({action})}).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const won=n=>Math.round(+n||0).toLocaleString('ko-KR');

function bar(lab,val,max,cls,unit){
  const pct=max>0?Math.max(2,Math.round((val/max)*100)):0;
  return `<div class="bar ${cls||''}"><div class="lab">${esc(lab)}</div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="val">${won(val)}<small>${unit||''}</small></div></div>`;
}

function renderStats(stats, rows){
  if(!stats || !stats.ok){ $('#content').innerHTML=`<div class="empty err">집계 응답 오류</div>`; return; }
  if(!stats.total){ $('#content').innerHTML=`<div class="empty">아직 축적된 데이터가 없습니다. 입력 폼에서 업체를 저장하면 여기에 집계됩니다.</div>`; status('데이터 없음'); return; }

  const v=stats.verify||{}, risk=stats.risk||{}, hs=stats.hallSummary;
  const hallCount=(stats.byType&&stats.byType['예식장'])||0;

  // KPI
  let html=`<div class="kpis">
    <div class="kpi"><b>총 업체</b><div class="v">${stats.total}<span class="u">곳</span></div></div>
    <div class="kpi"><b>예식장</b><div class="v">${hallCount}<span class="u">곳</span></div></div>
    <div class="kpi ok"><b>계속사업자 확인</b><div class="v">${v['계속']||0}<span class="u">곳</span></div></div>
    <div class="kpi seal"><b>위험신호 업체</b><div class="v">${risk.withAny||0}<span class="u">곳</span></div></div>
  </div>`;

  // 유형별 분포
  const types=Object.keys(stats.byType||{}).sort((a,b)=>stats.byType[b]-stats.byType[a]);
  const tmax=Math.max.apply(null,types.map(t=>stats.byType[t]).concat([1]));
  html+=`<h2>유형별 분포</h2><div class="panel">${
    types.map(t=>bar(t,stats.byType[t],tmax,'',' 곳')).join('')||'<div class="note">데이터 없음</div>'
  }</div>`;

  // 예식장 최소지출 비교
  if(stats.halls&&stats.halls.length){
    const hmax=Math.max.apply(null,stats.halls.map(h=>h.minSpend));
    html+=`<h2>예식장 최소지출 비교 <span class="tag ok">최저가 강조</span></h2><div class="panel">${
      stats.halls.map((h,i)=>bar(h.name,h.minSpend,hmax,i===0?'ok':'',' 만원')).join('')
    }${hs?`<div class="note">최저 ${won(hs.min)}만원 · 최고 ${won(hs.max)}만원 · 평균 ${won(hs.avg)}만원 (예식장 ${hs.count}곳). 최소지출=대관료+(1인식대×보증인원), 부가세·꽃·주류 별도.</div>`:''}</div>`;
  }

  // 위험신호 현황
  html+=`<h2>위험신호 현황</h2><div class="panel">
    <div class="bar seal"><div class="lab">위험신호 총 체크</div><div class="track"><div class="fill" style="width:${risk.total?100:0}%"></div></div><div class="val">${risk.total||0}<small> 건</small></div></div>
    <div class="note">위험신호 1개 이상: <b>${risk.withAny||0}곳</b> · 3개 이상(후보 하향 권고): <b style="color:var(--seal)">${risk.with3||0}곳</b> / 전체 ${stats.total}곳</div>
  </div>`;

  // 사업자 검증 현황
  html+=`<h2>사업자등록 검증 현황</h2><div class="panel">
    <div class="tblwrap"><table><thead><tr><th class="nm">상태</th><th>업체 수</th></tr></thead><tbody>
      <tr><td class="nm"><span class="tag ok">계속사업자</span></td><td>${v['계속']||0}</td></tr>
      <tr><td class="nm"><span class="tag amber">휴업</span></td><td>${v['휴업']||0}</td></tr>
      <tr><td class="nm"><span class="tag seal">폐업</span></td><td>${v['폐업']||0}</td></tr>
      <tr><td class="nm"><span class="tag">기타</span></td><td>${v['기타']||0}</td></tr>
      <tr><td class="nm"><span class="tag">미확인(조회 전)</span></td><td>${v['미확인']||0}</td></tr>
    </tbody></table></div>
    ${(v['미확인']||0)?`<div class="note">미확인 ${v['미확인']}곳은 귀가 후 홈택스/앱에서 사업자상태 조회 필요.</div>`:''}
  </div>`;

  // 업체 목록(보고서용)
  if(rows&&rows.rows&&rows.rows.length){
    const rs=rows.rows;
    html+=`<h2>업체 목록 (${rs.length}곳)</h2><div class="panel tblwrap"><table>
      <thead><tr><th class="nm">업체명</th><th class="nm">유형</th><th>사업자상태</th><th>최소지출(만원)</th><th>위험</th></tr></thead>
      <tbody>${rs.map(o=>{
        const rc=String(o['위험신호']||'').split('/').filter(s=>s.replace(/\s/g,'')).length;
        const st=String(o['사업자상태']||'');
        const stag=st.includes('계속')?'ok':(st.includes('폐업')?'seal':(st.includes('휴업')?'amber':''));
        return `<tr><td class="nm">${esc(o['업체명']||'미입력')}</td><td class="nm">${esc(o['유형']||'')}</td>
          <td>${st?`<span class="tag ${stag}">${esc(st)}</span>`:'<span class="tag">미확인</span>'}</td>
          <td>${o['최소지출(만원)']!==''&&o['최소지출(만원)']!=null?won(o['최소지출(만원)']):'—'}</td>
          <td>${rc?`<span class="tag seal">${rc}</span>`:'0'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  $('#content').innerHTML=html;
  const meta='집계 시각 '+(stats.generatedAt||'')+' · 시트 '+(stats.sheet||'-')+' · 총 '+stats.total+'곳';
  $('#printMeta').textContent=meta;
  status(meta);
}

async function loadAll(){
  status('불러오는 중…');
  try{
    const [stats, rows] = await Promise.all([call('stats'), call('rows').catch(()=>null)]);
    renderStats(stats, rows);
  }catch(e){
    $('#content').innerHTML=`<div class="empty err">${esc(e.message||'불러오기 실패')}</div>`;
    status('불러오기 실패');
  }
}
$('#refresh').onclick=loadAll;
$('#printBtn').onclick=()=>window.print();
if(GAS){ $('#backLink').href='?'; } // GAS: 폼은 파라미터 없는 같은 웹앱
loadAll();
</script>
</body>
</html>
